features:
  headline: Resultados medibles a corto plazo
  title: "Servicios"
  description: No solo ideas, me he especializado en lanzar productos y cumplir objetivos optimizando el tiempo de implementación y desarrollo.
  items:
    - icon: i-lucide-zap
      title: Producto Minimo Viable (MVP)
      description: Diseño de proyectos desde 0 a fin de crear productos con potencial de crecimiento en Startups y/o postulación a fondos concursables
    - icon: i-lucide-radar
      title: Internet de las cosas (IOT)
      description: Desarrollo de plataformas de monitoreo para sensores, instrumentos u otros dipositivos iOT en terreno, plantas o fábricas de control de sistemas complejos
    - icon: i-lucide-layers
      title: Software a medida
      description: "Convierto ideas y necesidades en soluciones automatizadas, dashboards informativos o paneles visuales"
    - icon: i-lucide-git-commit-horizontal
      title: Infraestructura como Servicio (IIAS)
      description: Traslado tu software a la nube, migrar sistemas completos desde nube o servidores propios
    - icon: i-lucide-tablet-smartphone
      title: Aplicación Mobile
      description: "Desarrollo de aplicaciones móviles para la integración de tus sistemas, dashboards o paneles existentes"
    - icon: i-lucide-toolbox
      title: Mantención Legacy
      description: Si tienes sistemas legacy puedo ayudar a mantenerlos, repararlos o mejorarlos, cuéntame tu caso
metrics:
  headline: Con números
  title: "Mi experiencia"
  description: Profesional experto en el ciclo de Desarrollo, Mantención y Despliegue de aplicaciones en entornos multidisciplinarios y de alta complejidad. Mediante un enfoque personalizado, me desenvuelvo como guía y referente clave en el diseño, gestión y construcción de soluciones escalables a largo plazo. 
  items:
    - value: "2012"
      label: El año que comencé este camino
      class: "text-success"
    - value: "4"
      label: Empresas o Startups en las que he servido
      class: "text-primary"
    - value: "+80"
      label: Cantidad de proyectos en los que he influído
      class: "text-info"
    - value: "+50"
      label: Clientes que confiaron en mis servicios
      class: "text-warning"
