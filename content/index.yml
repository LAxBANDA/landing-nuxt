          style: success
        - text: "Gracias al camino que he recorrido me he posicionado en el lugar estratégico que emprendedores, profesionales y empresas necesitan para llevar adelante sus proyectos, generando a través de una relación de confianza que permita ofrecer seguridad y certezas reales a mis clientes."
          style: dim
    - segments:
        - text: "→ "
